name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read # gitleaks-action lists a PR's commits through the API

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }} # every main commit gets a full run

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history so the secret scan sees every commit

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false

      - uses: pnpm/action-setup@v6 # version from "packageManager"

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:cov
      - run: pnpm cases
      - run: pnpm build

      - name: AI config check
        run: node scripts/check-ai-config.mjs

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @claimsense/web exec playwright install --with-deps chromium
      - run: pnpm --filter @claimsense/web build
      # The web server uses an in-memory MongoDB and never calls Gemini, so no secrets are needed.
      - run: pnpm --filter @claimsense/web e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: apps/web/test-results/
          retention-days: 7

  semgrep:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v7
      # The njsscan "good_helmet_checks" rules are informational: they report that helmet's headers ARE set
      # (apps/api/src/app.ts). --error would make that a failure, so exactly those rule ids are excluded.
      - run: >-
          semgrep scan --config p/typescript --config p/nodejsscan --config p/secrets --error
          --exclude node_modules --exclude 'apps/api/test/fixtures'
          --exclude-rule ajinabraham.njsscan.good.good_helmet_checks.helmet_header_x_powered_by
          --exclude-rule ajinabraham.njsscan.good.good_helmet_checks.helmet_header_dns_prefetch
          --exclude-rule ajinabraham.njsscan.good.good_helmet_checks.helmet_header_hsts
          --exclude-rule ajinabraham.njsscan.good.good_helmet_checks.helmet_header_ienoopen
          --exclude-rule ajinabraham.njsscan.good.good_helmet_checks.helmet_header_nosniff
          --exclude-rule ajinabraham.njsscan.good.good_helmet_checks.helmet_header_xss_filter
