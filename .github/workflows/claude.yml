# Mention @claude in an issue or PR comment to have Claude implement, fix or explain.
# Enabled only when the repository variable CLAUDE_ENABLED is 'true' and the secret
# CLAUDE_CODE_OAUTH_TOKEN exists (made with `claude setup-token` on YOUR account).
name: Claude Code
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
permissions:
  contents: read
jobs:
  claude:
    if: vars.CLAUDE_ENABLED == 'true' && contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write        # pushes to branches only; the main ruleset blocks direct pushes
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: "--max-turns 20"
