# Claude reviews each PR against CLAUDE.md and posts inline comments.
# No plugins or marketplaces. Enabled only when the repository variable CLAUDE_ENABLED is 'true'.
name: Claude Code Review
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
permissions:
  contents: read
jobs:
  review:
    if: vars.CLAUDE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Review pull request #${{ github.event.pull_request.number }} in ${{ github.repository }}.
            Use the golden rules in CLAUDE.md and the checklist in .claude/agents/code-reviewer.md.
            Focus on correctness, owner scoping (404 for other users), validation, secrets, health data
            in logs, and tests that mirror the implementation instead of the spec.
            Post each real issue as an inline comment; if there are none, post one short summary comment.
            Do not approve the PR and do not push commits.
          claude_args: '--max-turns 12 --allowedTools "mcp__github_inline_comment__create_inline_comment,Read,Grep,Glob,Bash(gh pr diff:*),Bash(gh pr view:*)"'
